    - docker push "$REPO_BACK"
    - docker rmi $REPO_BACK -f
    - scp .env env.stage.backend deploy/stage/docker-compose.yaml ${SSH_SERVER_ID_STAGE}:/home/cvtinstage/cvtinder/backend
